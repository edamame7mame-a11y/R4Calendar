<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>一般エリア - R4カレンダー</title>
<style>body{font-family:system-ui,sans-serif;background:#f4f5f7;margin:0;padding:24px;color:#222}.card{max-width:560px;margin:8vh auto;background:white;padding:24px;border-radius:16px;box-shadow:0 4px 20px #0001}button{padding:10px 16px;border:0;border-radius:9px;background:#555;color:white;font-size:1rem}</style></head>
<body><main class="card"><h1>一般エリア</h1><p>一般向けの共有機能の移行先です。</p><p id="state">認証を確認しています…</p><button id="logout" hidden>ログアウト</button></main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";
import { firebaseConfig } from "../firebase-config.js";
const app=initializeApp(firebaseConfig); const auth=getAuth(app);
const state=document.getElementById("state"); const logout=document.getElementById("logout");
onAuthStateChanged(auth,async user=>{
 if(!user){location.replace("/login.html");return;}
 try{
  const token=await user.getIdTokenResult();
  if(token.claims.area!=="general"){await signOut(auth);location.replace("/login.html");return;}
  state.textContent="ログイン確認済み。機能を順次移行します。";
  logout.hidden=false;
 }catch{await signOut(auth);location.replace("/login.html");}
});
logout.addEventListener("click",async()=>{await signOut(auth);location.replace("/login.html");});
</script></body></html>
