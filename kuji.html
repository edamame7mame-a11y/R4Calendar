<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎲 お知らせ当番決め</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #fdf4ff; text-align: center; padding: 20px; color: #333; margin: 0; }
    h1 { font-size: 1.4rem; color: #a21caf; margin-top: 10px; margin-bottom: 20px; }
    .settings { background: #fff; border-radius: 12px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); text-align: left; max-width: 350px; margin: 0 auto; }
    .settings label { font-weight: bold; font-size: 0.85rem; color: #a21caf; display: block; margin-top: 12px; }
    .settings label:first-child { margin-top: 0; }
    textarea, input[type="date"], select { width: 100%; padding: 10px; margin-top: 6px; border: 2px solid #f5d0fe; border-radius: 8px; font-size: 1rem; box-sizing: border-box; outline: none; }
    textarea { height: 100px; resize: none; }
    textarea:focus, input:focus, select:focus { border-color: #d946ef; }
    .btn-draw { background: #d946ef; color: white; border: none; padding: 14px 32px; font-size: 1.1rem; border-radius: 30px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 6px rgba(217,70,239,0.3); margin-top: 24px; width: 100%; max-width: 350px; }
    .btn-draw:active { transform: scale(0.95); box-shadow: 0 2px 4px rgba(217,70,239,0.3); }
    #result-box { margin-top: 30px; min-height: 90px; }
    .back-btn { display: inline-block; margin-top: 40px; padding: 10px 20px; background: #fff; color: #4b5563; text-decoration: none; border-radius: 20px; border: 1px solid #d1d5db; font-size: 0.9rem; font-weight: bold; }
  </style>
</head>
<body>
  <h1>🎲 お知らせ当番決め</h1>
  
  <div class="settings">
    <label>1. 候補者の名前（改行して入力）</label>
    <textarea id="names" placeholder="ジャザたん&#10;たきりん&#10;しず..."></textarea>

    <label>2. いつからの当番？</label>
    <input type="date" id="startDate">

    <label>3. 何日分決める？</label>
    <select id="drawCount">
      <option value="3">3日分</option>
      <option value="4">4日分</option>
      <option value="5">5日分</option>
      <option value="6">6日分</option>
      <option value="7">7日分</option>
      <option value="8">8日分</option>
      <option value="9">9日分</option>
      <option value="10">10日分</option>
    </select>
  </div>
  
  <button class="btn-draw" onclick="startKuji()">ルーレットを回す！</button>
  
  <div id="result-box"></div>

  <a href="index.html" class="back-btn">← カレンダーに戻る</a>

  <script>
    // 今日の日付をセット
    window.onload = () => {
      const now = new Date();
      now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
      document.getElementById("startDate").value = now.toISOString().slice(0, 10);
    };

    let isSpinning = false;
    function startKuji() {
      if (isSpinning) return;
      
      const text = document.getElementById('names').value;
      const items = text.split('\n').map(item => item.trim()).filter(item => item !== '');
      const startDateStr = document.getElementById('startDate').value;
      const count = parseInt(document.getElementById('drawCount').value, 10);
      
      if (items.length === 0) { alert('名前を入力してください！'); return; }
      if (!startDateStr) { alert('開始日を選んでください！'); return; }

      isSpinning = true;
      const resultBox = document.getElementById('result-box');
      const drawBtn = document.querySelector('.btn-draw');
      drawBtn.style.opacity = '0.5';
      drawBtn.textContent = '抽選中...';
      resultBox.innerHTML = '<div style="font-size: 2rem; font-weight: bold; color: #a21caf; padding: 20px;">🎲</div>';
      
      // くじのロジック（人数が足りない場合はシャッフルし直して補充）
      let selected = [];
      let pool = [...items].sort(() => 0.5 - Math.random());
      for (let i = 0; i < count; i++) {
        if (pool.length === 0) pool = [...items].sort(() => 0.5 - Math.random());
        selected.push(pool.pop());
      }
      
      const startDate = new Date(startDateStr);
      let spinCount = 0;
      
      // アニメーション
      const timer = setInterval(() => {
        resultBox.innerHTML = `<div style="font-size: 1.5rem; font-weight: bold; color: #d946ef; margin-top:20px;">${items[Math.floor(Math.random() * items.length)]}</div>`;
        spinCount++;
        
        if (spinCount >= 15) {
          clearInterval(timer);
          
          let html = '<div style="font-size: 1.1rem; color: #ec4899; font-weight: bold; margin-bottom: 16px;">🎉 当番決定 🎉</div>';
          html += '<div style="background: #fff; border-radius: 12px; padding: 16px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: left; max-width: 350px; margin: 0 auto;">';
          
          const weekDays = ["日", "月", "火", "水", "木", "金", "土"];
          for (let i = 0; i < count; i++) {
            let d = new Date(startDate);
            d.setDate(d.getDate() + i);
            let dateStr = `${d.getMonth() + 1}/${d.getDate()}`;
            let wDay = weekDays[d.getDay()];
            
            html += `<div style="font-size: 1.1rem; margin: 10px 0; border-bottom: 1px dashed #f5d0fe; padding-bottom: 6px; display: flex; justify-content: space-between;">`;
            html += `<span style="color: #6b7280; font-size: 0.95rem;">${dateStr}(${wDay})</span>`;
            html += `<span style="font-weight: bold; color: #333;">${selected[i]}</span>`;
            html += `</div>`;
          }
          html += '</div>';
          
          resultBox.innerHTML = html;
          isSpinning = false;
          drawBtn.style.opacity = '1';
          drawBtn.textContent = 'もう一度決める';
        }
      }, 60); 
    }
  </script>
</body>
</html>
