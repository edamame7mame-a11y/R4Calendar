<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>📝 お知らせテンプレ・要点</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f0fdf4; color: #222; margin: 0; padding: 16px; }
    
    header { display: flex; justify-content: space-between; align-items: center; max-width: 500px; margin: 0 auto 16px auto; }
    h1 { font-size: 1.2rem; color: #166534; margin: 0; }
    .btn-add { background: #16a34a; color: #fff; border: none; padding: 8px 14px; border-radius: 20px; font-weight: bold; font-size: 0.85rem; cursor: pointer; box-shadow: 0 2px 5px rgba(22, 163, 74, 0.3); }

    .container { max-width: 500px; margin: 0 auto; }
    
    .card { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.05); border-left: 5px solid #16a34a; }
    .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; gap: 8px; }
    .card-title { font-size: 1.05rem; font-weight: bold; color: #166534; margin: 0; word-break: break-all; }
    .card-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .btn-action { border: none; padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; cursor: pointer; }
    .btn-copy { background: #dcfce7; color: #15803d; }
    .btn-edit { background: #f3f4f6; color: #4b5563; }
    
    .card-body { font-size: 0.9rem; color: #374151; white-space: pre-wrap; word-break: break-all; background: #f9fafb; padding: 10px; border-radius: 8px; line-height: 1.5; border: 1px solid #f3f4f6; }

    .back-wrap { text-align: center; margin-top: 30px; margin-bottom: 20px; }
    .back-btn { display: inline-block; padding: 10px 20px; background: #fff; color: #4b5563; text-decoration: none; border-radius: 20px; border: 1px solid #d1d5db; font-size: 0.9rem; font-weight: bold; }

    /* モーダル */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; padding: 16px; }
    .modal-overlay.open { display: flex; }
    .modal { background: #fff; border-radius: 14px; padding: 18px; width: 100%; max-width: 400px; max-height: 90vh; overflow-y: auto; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
    .modal h2 { font-size: 1.05rem; color: #166534; margin-top: 0; margin-bottom: 12px; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.8rem; font-weight: bold; color: #444; margin-bottom: 4px; }
    .form-group input, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 0.95rem; outline: none; }
    .form-group textarea { height: 160px; resize: none; line-height: 1.5; }
    .form-group input:focus, .form-group textarea:focus { border-color: #16a34a; }
    
    .modal-buttons { display: flex; gap: 8px; margin-top: 16px; }
    .modal-buttons button { flex: 1; padding: 10px; border-radius: 8px; font-weight: bold; border: none; cursor: pointer; font-size: 0.9rem; }
    .btn-save { background: #16a34a; color: #fff; }
    .btn-delete { background: #ef4444; color: #fff; }
    .btn-cancel { background: #e5e7eb; color: #4b5563; }
  </style>
</head>
<body>

  <header>
    <h1>📝 お知らせの要点一覧</h1>
    <button class="btn-add" id="openAddBtn">＋ 追加する</button>
  </header>

  <div class="container" id="memoList">
    <div style="text-align: center; color: #6b7280; padding: 30px; font-size: 0.9rem;">読み込み中...</div>
  </div>

  <div class="back-wrap">
    <a href="index.html" class="back-btn">← カレンダーに戻る</a>
  </div>

  <!-- 追加・編集モーダル -->
  <div class="modal-overlay" id="memoModal">
    <div class="modal">
      <h2 id="modalTitle">項目の追加</h2>
      <div class="form-group">
        <label>イベント名</label>
        <input type="text" id="memoTitle" placeholder="例: 🧀チーズ、わらわら、シールド">
      </div>
      <div class="form-group">
        <label>お知らせに絶対入れて欲しい内容</label>
        <textarea id="memoContent" placeholder="・開始時間の30分前に予告すること&#10;・集合場所の座標を入れること&#10;&#10;【テンプレ文】&#10;本日〇時より〇〇を開催します！"></textarea>
      </div>
      <div class="modal-buttons">
        <button class="btn-delete" id="deleteBtn" style="display: none;">削除</button>
        <button class="btn-cancel" id="closeBtn">キャンセル</button>
        <button class="btn-save" id="saveBtn">保存</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { getFirestore, collection, addDoc, doc, deleteDoc, updateDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDhHBvpdoIfVkRKbDAMsr811zXeI2AVrwo",
      authDomain: "r4calendar-1cb70.firebaseapp.com",
      projectId: "r4calendar-1cb70",
      storageBucket: "r4calendar-1cb70.firebasestorage.app",
      messagingSenderId: "273656700256",
      appId: "1:273656700256:web:254da78a155c5c8e3b5205"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const memosRef = collection(db, "memos");

    let currentDocId = null;
    let memosData = [];

    const listEl = document.getElementById("memoList");
    const modal = document.getElementById("memoModal");
    const titleInput = document.getElementById("memoTitle");
    const contentInput = document.getElementById("memoContent");
    const deleteBtn = document.getElementById("deleteBtn");

    // データのリアルタイム取得
    onSnapshot(memosRef, (snapshot) => {
      const items = [];
      snapshot.forEach((docSnap) => {
        const d = docSnap.data();
        items.push({
          id: docSnap.id,
          title: d.title || "名称未設定",
          content: d.content || "",
          createdAt: d.createdAt || ""
        });
      });
      // 作成日順（古い順＝上から順番）に並べる
      items.sort((a, b) => a.createdAt.localeCompare(b.createdAt));
      memosData = items;
      renderList();
    });

    function renderList() {
      listEl.innerHTML = "";
      if (memosData.length === 0) {
        listEl.innerHTML = `<div style="text-align: center; color: #6b7280; padding: 40px 10px; background: #fff; border-radius: 12px; font-size: 0.9rem;">まだ登録されていません。<br>右上の「＋ 追加する」から作成できます！</div>`;
        return;
      }

      memosData.forEach(item => {
        const card = document.createElement("div");
        card.className = "card";

        const safeTitle = String(item.title).replace(/</g, '&lt;').replace(/>/g, '&gt;');
        const safeContent = String(item.content).replace(/</g, '&lt;').replace(/>/g, '&gt;');

        card.innerHTML = `
          <div class="card-header">
            <h3 class="card-title">${safeTitle}</h3>
            <div class="card-actions">
              <button class="btn-action btn-copy" data-id="${item.id}">📋 コピー</button>
              <button class="btn-action btn-edit" data-id="${item.id}">✏️ 編集</button>
            </div>
          </div>
          <div class="card-body">${safeContent}</div>
        `;
        listEl.appendChild(card);
      });

      // コピーボタンの動作
      document.querySelectorAll(".btn-copy").forEach(btn => {
        btn.onclick = () => {
          const target = memosData.find(m => m.id === btn.dataset.id);
          if (target) {
            navigator.clipboard.writeText(target.content).then(() => {
              const originalText = btn.textContent;
              btn.textContent = "✔ コピー完了";
              setTimeout(() => { btn.textContent = originalText; }, 1500);
            }).catch(() => {
              alert("コピーに失敗しました");
            });
          }
        };
      });

      // 編集ボタンの動作
      document.querySelectorAll(".btn-edit").forEach(btn => {
        btn.onclick = () => {
          const target = memosData.find(m => m.id === btn.dataset.id);
          if (target) openEditModal(target);
        };
      });
    }

    // 新規追加モーダルを開く
    document.getElementById("openAddBtn").onclick = () => {
      currentDocId = null;
      document.getElementById("modalTitle").textContent = "イベント要点を追加";
      titleInput.value = "";
      contentInput.value = "";
      deleteBtn.style.display = "none";
      modal.classList.add("open");
    };

    // 編集モーダルを開く
    function openEditModal(item) {
      currentDocId = item.id;
      document.getElementById("modalTitle").textContent = "内容の編集";
      titleInput.value = item.title;
      contentInput.value = item.content;
      deleteBtn.style.display = "block";
      modal.classList.add("open");
    }

    document.getElementById("closeBtn").onclick = () => modal.classList.remove("open");

    // 保存処理
    document.getElementById("saveBtn").onclick = async () => {
      const title = titleInput.value.trim();
      const content = contentInput.value.trim();
      if (!title || !content) {
        alert("イベント名と内容の両方を入力してください！");
        return;
      }

      try {
        if (currentDocId) {
          await updateDoc(doc(db, "memos", currentDocId), { title, content });
        } else {
          await addDoc(memosRef, { title, content, createdAt: new Date().toISOString() });
        }
        modal.classList.remove("open");
      } catch(e) {
        alert("保存エラー: " + e.message);
      }
    };

    // 削除処理
    deleteBtn.onclick = async () => {
      if (!currentDocId) return;
      if (confirm("この項目を削除しますか？")) {
        try {
          await deleteDoc(doc(db, "memos", currentDocId));
          modal.classList.remove("open");
        } catch(e) {
          alert("削除エラー: " + e.message);
        }
      }
    };
  </script>
</body>
</html>
