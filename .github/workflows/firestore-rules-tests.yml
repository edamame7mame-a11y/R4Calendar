name: Firestore rules tests

on:
  push:
    branches:
      - secure-site-build
    paths:
      - "secure-site/**"
      - ".github/workflows/firestore-rules-tests.yml"
  pull_request:
    branches:
      - secure-site-build
    paths:
      - "secure-site/**"
      - ".github/workflows/firestore-rules-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firestore-rules:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: secure-site
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java for Firebase Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm install

      - name: Run Firestore rules tests in emulator
        run: npx firebase emulators:exec --project r4calendar-2c6f8 --only firestore "npx vitest run tests/firestore.rules.test.js"

      - name: Check migrated page inline JavaScript syntax
        run: python tests/check-inline-scripts.py
      - name: Run protected route middleware tests
        run: npx vitest run tests/route-middleware.test.js
