<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"><title>R4予定表</title>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f4f5f7;color:#222}header{background:#fff;padding:10px 14px;border-bottom:1px solid #e0e0e0;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}header h1{font-size:1.15rem;font-weight:700;color:#333;margin:0}.header-btns{display:flex;gap:6px}.btn-header{border:none;padding:6px 12px;border-radius:16px;font-weight:600;font-size:.8rem;cursor:pointer}.btn-setting{background:#e5e7eb;color:#374151}.btn-add{background:#2563eb;color:#fff}#calendar-container{padding:4px;max-width:900px;margin:0 auto}#calendar{background:#fff;border-radius:8px}.fc .fc-toolbar{padding:8px;margin-bottom:2px}.fc .fc-toolbar-title{font-size:1rem!important;font-weight:700}.fc .fc-button{padding:4px 8px!important;font-size:.8rem!important}.fc .fc-col-header-cell{padding:4px 0;background:#fafafa;font-size:.8rem}.fc-theme-standard td,.fc-theme-standard th{border-color:#e5e7eb}.fc .fc-daygrid-day-number{font-size:.8rem;font-weight:600;padding:2px 4px!important;color:#444}.fc .fc-daygrid-day-frame{min-height:80px!important;cursor:pointer}.fc-day-sun .fc-daygrid-day-number{color:#dc2626!important}.fc-day-sat .fc-daygrid-day-number{color:#2563eb!important}.fc-day-holiday .fc-daygrid-day-number{color:#dc2626!important;font-weight:800!important}.fc-event{border:none!important;border-radius:6px!important;margin:1px!important;padding:1px 4px!important;font-size:.72rem!important;font-weight:600!important;line-height:1.25!important;cursor:pointer;display:block!important}.fc-daygrid-event .fc-event-main{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;justify-content:center;align-items:center;padding:16px}.modal-overlay.open{display:flex}.modal{background:#fff;border-radius:14px;padding:18px;width:100%;max-width:380px;max-height:90vh;overflow-y:auto;box-shadow:0 10px 25px rgba(0,0,0,.2)}.modal h2{font-size:1.05rem;margin-bottom:12px}.form-group{margin-bottom:10px}.form-group label{display:block;font-size:.8rem;font-weight:600;margin-bottom:3px;color:#444}.form-group input,.form-group select,.form-group textarea{width:100%;padding:8px;border:1px solid #ccc;border-radius:6px;font-size:.9rem}.checkbox-group{display:flex;align-items:center;gap:8px;margin-bottom:12px;background:#f3f4f6;padding:8px 12px;border-radius:8px}.checkbox-group input{width:20px;height:20px}.checkbox-group label{margin-bottom:0;font-size:.9rem;font-weight:600}.modal-buttons{display:flex;gap:8px;margin-top:14px}.modal-buttons button{flex:1;padding:10px;border-radius:6px;font-weight:600;font-size:.95rem;border:none;cursor:pointer}.btn-submit{background:#2563eb;color:#fff}.btn-delete{background:#ef4444;color:#fff}.btn-cancel{background:#e5e7eb;color:#4b5563}.label-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}.color-box{width:24px;height:24px;border-radius:6px;flex-shrink:0;border:1px solid rgba(0,0,0,.1)}
</style>
</head>
<body>
<header><h1>R4予定表</h1><div class="header-btns"><button class="btn-header btn-setting" id="openSettingsBtn">⚙️ ラベル</button><button class="btn-header btn-add" id="openModalBtn">＋ 追加</button></div></header>
<div id="calendar-container"><div id="calendar"></div></div>

<!-- ポップアップ専用画面 -->
<div class="modal-overlay" id="alertOverlay"><div class="modal"><h2 style="color:#ea580c;display:flex;align-items:center;gap:8px;">📢 本日の予定</h2><div id="alertMessage" style="font-size:.95rem;white-space:pre-wrap;margin-bottom:16px;line-height:1.5;color:#333;"></div><div class="modal-buttons"><button class="btn-submit" id="closeAlertBtn">OK</button></div></div></div>

<div class="modal-overlay" id="modalOverlay"><div class="modal"><h2 id="modalTitle">予定の追加</h2>
<div class="form-group"><label>予定のタイトル</label><input type="text" id="eventTitle"></div>
<div class="form-group"><label>カラー（カテゴリ）</label><select id="eventColor"></select></div>
<div class="form-group"><label>日付</label><input type="date" id="eventDate"></div>
<div class="checkbox-group"><input type="checkbox" id="eventAllDay" checked><label for="eventAllDay">終日（時間指定なし）</label></div>
<div id="timePickerGroup" style="display:none;gap:10px;"><div class="form-group" style="flex:1;margin-bottom:0;"><label>開始時間</label><input type="time" id="eventStartTime" value="12:00"></div><div class="form-group" style="flex:1;margin-bottom:0;"><label>終了時間（任意）</label><input type="time" id="eventEndTime"></div></div>
<div class="form-group" style="margin-top:12px;"><label>内容説明・メモ</label><textarea id="eventDesc" rows="3"></textarea></div>
<div class="modal-buttons"><button class="btn-delete" id="deleteEventBtn" style="display:none;">削除</button><button class="btn-cancel" id="closeModalBtn">閉じる</button><button class="btn-submit" id="saveEventBtn">保存</button></div></div></div>

<div class="modal-overlay" id="settingsOverlay"><div class="modal"><h2>色の名前・ラベル設定</h2><p style="font-size:.78rem;color:#666;margin-bottom:12px;">それぞれの色に付ける名前を設定できます</p><div id="labelInputsContainer" style="max-height:50vh;overflow-y:auto;padding-right:4px;"></div><div class="modal-buttons"><button class="btn-cancel" id="closeSettingsBtn">キャンセル</button><button class="btn-submit" id="saveSettingsBtn">保存</button></div></div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
import { getFirestore, collection, addDoc, doc, deleteDoc, updateDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";
const DEFAULT_COLORS = [{id:0,defaultName:"ジャザ",bg:"#06B6D4",text:"#ffffff"},{id:1,defaultName:"豆たん",bg:"#84CC16",text:"#000000"},{id:2,defaultName:"いかれた猫",bg:"#4B5563",text:"#ffffff"},{id:3,defaultName:"シチミ",bg:"#A855F7",text:"#ffffff"},{id:4,defaultName:"しず",bg:"#EF4444",text:"#ffffff"},{id:5,defaultName:"ひな",bg:"#3B82F6",text:"#ffffff"},{id:6,defaultName:"🧀",bg:"#FFF066",text:"#000000"},{id:7,defaultName:"秘薬",bg:"#F97316",text:"#ffffff"},{id:8,defaultName:"車掌",bg:"#EC4899",text:"#ffffff"},{id:9,defaultName:"オリーブ",bg:"#65A30D",text:"#ffffff"},{id:10,defaultName:"追加枠1",bg:"#14B8A6",text:"#ffffff"},{id:11,defaultName:"追加枠2",bg:"#4F46E5",text:"#ffffff"},{id:12,defaultName:"追加枠3",bg:"#22C55E",text:"#ffffff"},{id:13,defaultName:"追加枠4",bg:"#A16207",text:"#ffffff"}];
function getCustomLabels(){try{const s=localStorage.getItem("r4_custom_labels_v10");if(s)return JSON.parse(s);}catch(e){}return DEFAULT_COLORS.map(c=>c.defaultName);}
let customLabels = getCustomLabels();
const firebaseConfig = {apiKey: "AIzaSyDhHBvpdoIfVkRKbDAMsr811zXeI2AVrwo",authDomain: "r4calendar-1cb70.firebaseapp.com",projectId: "r4calendar-1cb70",storageBucket: "r4calendar-1cb70.firebasestorage.app",messagingSenderId: "273656700256",appId: "1:273656700256:web:254da78a155c5c8e3b5205"};
const app = initializeApp(firebaseConfig);const db = getFirestore(app);const eventsRef = collection(db, "events");
function renderColorOptions(){const s=document.getElementById("eventColor");s.innerHTML="";DEFAULT_COLORS.forEach((c,i)=>{const o=document.createElement("option");o.value=i;o.textContent=customLabels[i]||c.defaultName;s.appendChild(o);});}
renderColorOptions();
let holidays={},currentEventDocId=null,hasShownTodayAlert=false;
const calendarEl=document.getElementById('calendar');
const calendar=new FullCalendar.Calendar(calendarEl,{
  initialView:'dayGridMonth',headerToolbar:{left:'prev,next today',center:'title',right:'dayGridMonth,listMonth'},buttonText:{today:'今日',month:'月',list:'リスト'},locale:'ja',contentHeight:'auto',dayMaxEventRows:5,eventDisplay:'block',
  dayCellDidMount:function(arg){const dStr=arg.date.getFullYear()+'-'+String(arg.date.getMonth()+1).padStart(2,'0')+'-'+String(arg.date.getDate()).padStart(2,'0');if(holidays[dStr])arg.el.classList.add('fc-day-holiday');},
  eventDidMount:function(arg){
    try{if(arg.view.type==='listMonth'){const td=arg.el.querySelector('.fc-list-event-title');if(td){const p=arg.event.extendedProps||{};const cIdx=p.colorIdx!==undefined?p.colorIdx:0;const col=DEFAULT_COLORS[cIdx]||DEFAULT_COLORS[0];const lName=customLabels[cIdx]||col.defaultName;let tStr='終日';if(!arg.event.allDay&&arg.event.start){let h=String(arg.event.start.getHours()).padStart(2,'0');let m=String(arg.event.start.getMinutes()).padStart(2,'0');tStr=h+':'+m;}let htm='<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-weight:bold;"><span style="background:'+col.bg+';color:'+col.text+';padding:2px 6px;border-radius:4px;font-size:0.7rem;">'+lName+'</span><span style="font-size:0.85rem;color:#555;">'+tStr+'</span><span>'+String(arg.event.title).replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</span></div>';if(p.desc){htm+='<div style="font-size:0.82rem;color:#4b5563;background:#f9fafb;border-left:3px solid #cbd5e1;padding:4px 8px;margin-top:4px;white-space:pre-wrap;word-break:break-all;">'+String(p.desc).replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</div>';}td.innerHTML=htm;}}}catch(e){}
  },
  eventClick:function(info){openEditModal(info.event);},
  dateClick:function(info){currentEventDocId=null;document.getElementById("modalTitle").textContent="予定の追加";document.getElementById("eventTitle").value="";document.getElementById("eventDesc").value="";document.getElementById("eventDate").value=info.dateStr;document.getElementById("eventStartTime").value="12:00";document.getElementById("eventEndTime").value="";allDayCheck.checked=true;updateTimeInputVisibility();deleteBtn.style.display="none";saveBtn.style.display="block";saveBtn.textContent="保存";modal.classList.add("open");}
});
calendar.render();
fetch("https://holidays-jp.github.io/api/v1/date.json").then(r=>r.json()).then(d=>{holidays=d;calendar.render();}).catch(e=>console.log(e));
onSnapshot(eventsRef,(s)=>{
  const evs=[];s.forEach((dSnap)=>{try{const d=dSnap.data();if(!d.start)return;const cIdx=d.colorIdx!==undefined?d.colorIdx:0;const col=DEFAULT_COLORS[cIdx]||DEFAULT_COLORS[0];evs.push({id:dSnap.id,title:d.title||"名称未設定",start:d.start,end:d.end||null,allDay:d.allDay!==false,backgroundColor:col.bg,textColor:col.text,extendedProps:{desc:d.desc||"",colorIdx:cIdx}});}catch(e){}});
  calendar.removeAllEvents();calendar.addEventSource(evs);
  if(!hasShownTodayAlert){hasShownTodayAlert=true;const n=new Date();const tStr=n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0');const tEvs=evs.filter(e=>e.start&&e.start.startsWith(tStr));if(tEvs.length>0){let m="";tEvs.forEach(e=>{const cn=customLabels[e.extendedProps.colorIdx]||"未設定";let t="終日";if(!e.allDay&&e.start.includes("T"))t=e.start.substring(11,16);m+=`・${t} [${cn}] ${e.title}\n`;});setTimeout(()=>{document.getElementById('alertMessage').textContent=m;document.getElementById('alertOverlay').classList.add('open');},800);}}
});
document.getElementById('closeAlertBtn').onclick=()=>document.getElementById('alertOverlay').classList.remove('open');
const allDayCheck=document.getElementById("eventAllDay");const timePickerGroup=document.getElementById("timePickerGroup");
function updateTimeInputVisibility(){timePickerGroup.style.display=allDayCheck.checked?"none":"flex";}
allDayCheck.addEventListener("change",updateTimeInputVisibility);
const modal=document.getElementById("modalOverlay"),deleteBtn=document.getElementById("deleteEventBtn"),saveBtn=document.getElementById("saveEventBtn");
document.getElementById("openModalBtn").onclick=()=>{currentEventDocId=null;document.getElementById("modalTitle").textContent="予定の追加";document.getElementById("eventTitle").value="";document.getElementById("eventDesc").value="";const n=new Date();n.setMinutes(n.getMinutes()-n.getTimezoneOffset());document.getElementById("eventDate").value=n.toISOString().slice(0,10);document.getElementById("eventStartTime").value="12:00";document.getElementById("eventEndTime").value="";allDayCheck.checked=true;updateTimeInputVisibility();deleteBtn.style.display="none";saveBtn.style.display="block";saveBtn.textContent="保存";modal.classList.add("open");};
function openEditModal(ev){currentEventDocId=ev.id;document.getElementById("modalTitle").textContent="予定の詳細・変更";document.getElementById("eventTitle").value=ev.title;document.getElementById("eventDesc").value=ev.extendedProps.desc||"";document.getElementById("eventColor").value=ev.extendedProps.colorIdx||0;allDayCheck.checked=ev.allDay;if(ev.allDay){document.getElementById("eventDate").value=ev.startStr.slice(0,10);document.getElementById("eventStartTime").value="12:00";document.getElementById("eventEndTime").value="";}else{document.getElementById("eventDate").value=ev.startStr.slice(0,10);document.getElementById("eventStartTime").value=ev.startStr.slice(11,16);document.getElementById("eventEndTime").value=ev.endStr?ev.endStr.slice(11,16):"";}updateTimeInputVisibility();deleteBtn.style.display="block";saveBtn.style.display="block";saveBtn.textContent="更新";modal.classList.add("open");}
document.getElementById("closeModalBtn").onclick=()=>modal.classList.remove("open");
saveBtn.onclick=async()=>{const t=document.getElementById("eventTitle").value.trim(),cIdx=parseInt(document.getElementById("eventColor").value,10),isAll=allDayCheck.checked,d=document.getElementById("eventDesc").value.trim(),dVal=document.getElementById("eventDate").value,sT=document.getElementById("eventStartTime").value,eT=document.getElementById("eventEndTime").value;if(!t||!dVal){alert("タイトルと日付を入力してください");return;}if(!isAll&&!sT){alert("開始時間を入力してください");return;}let sVal=isAll?dVal:`${dVal}T${sT}:00`,eVal=isAll?null:(eT?`${dVal}T${eT}:00`:null);try{if(currentEventDocId)await updateDoc(doc(db,"events",currentEventDocId),{title:t,colorIdx:cIdx,allDay:isAll,start:sVal,end:eVal,desc:d});else await addDoc(eventsRef,{title:t,colorIdx:cIdx,allDay:isAll,start:sVal,end:eVal,desc:d,createdAt:new Date().toISOString()});modal.classList.remove("open");}catch(e){alert("エラー: "+e.message);}};
deleteBtn.onclick=async()=>{if(!currentEventDocId)return;if(confirm("この予定を削除しますか？")){try{await deleteDoc(doc(db,"events",currentEventDocId));modal.classList.remove("open");}catch(e){}}};
const settingsModal=document.getElementById("settingsOverlay"),labelInputsContainer=document.getElementById("labelInputsContainer");
document.getElementById("openSettingsBtn").onclick=()=>{labelInputsContainer.innerHTML="";DEFAULT_COLORS.forEach((c,idx)=>{const r=document.createElement("div");r.className="label-row";r.innerHTML=`<div class="color-box" style="background:${c.bg}"></div><input type="text" data-idx="${idx}" value="${customLabels[idx]||c.defaultName}" placeholder="ラベル名">`;labelInputsContainer.appendChild(r);});settingsModal.classList.add("open");};
document.getElementById("closeSettingsBtn").onclick=()=>settingsModal.classList.remove("open");
document.getElementById("saveSettingsBtn").onclick=()=>{const is=labelInputsContainer.querySelectorAll("input");is.forEach(i=>{const idx=parseInt(i.dataset.idx,10);customLabels[idx]=i.value.trim()||DEFAULT_COLORS[idx].defaultName;});try{localStorage.setItem("r4_custom_labels_v10",JSON.stringify(customLabels));}catch(e){}renderColorOptions();settingsModal.classList.remove("open");};
</script>
</body>
</html>
