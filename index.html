<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>R4予定表</title>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f5f7; color: #222; }
    header { background: #fff; padding: 10px 14px; border-bottom: 1px solid #e0e0e0; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 10; }
    header h1 { font-size: 1.1rem; font-weight: 700; color: #333; }
    .header-btns { display: flex; gap: 6px; }
    .btn-header { border: none; padding: 6px 12px; border-radius: 16px; font-weight: 600; font-size: 0.8rem; cursor: pointer; }
    .btn-setting { background: #e5e7eb; color: #374151; }
    .btn-add { background: #2563eb; color: #fff; }

    #calendar-container { padding: 4px; max-width: 900px; margin: 0 auto; }
    #calendar { background: #fff; border-radius: 8px; }

    /* FullCalendarカスタマイズ */
    .fc .fc-toolbar { padding: 8px; margin-bottom: 2px; }
    .fc .fc-toolbar-title { font-size: 1rem !important; font-weight: bold; }
    .fc .fc-button { padding: 4px 8px !important; font-size: 0.8rem !important; }
    .fc .fc-col-header-cell { padding: 4px 0; background: #fafafa; font-size: 0.8rem; }
    .fc-theme-standard td, .fc-theme-standard th { border-color: #e5e7eb; }
    .fc .fc-daygrid-day-number { font-size: 0.8rem; font-weight: 600; padding: 2px 4px !important; color: #444; }
    .fc .fc-daygrid-day-frame { min-height: 80px !important; }

    /* 日曜日と土曜日の色 */
    .fc-day-sun .fc-daygrid-day-number { color: #dc2626 !important; }
    .fc-day-sat .fc-daygrid-day-number { color: #2563eb !important; }

    /* 祝日の赤色表示 */
    .fc-day-holiday .fc-daygrid-day-number { color: #dc2626 !important; font-weight: 800 !important; }
    .holiday-badge { font-size: 0.65rem; color: #dc2626; font-weight: bold; margin-left: 2px; }

    /* イベントバッジ表示（月表示） */
    .fc-event {
      border: none !important;
      border-radius: 6px !important;
      margin: 1px 1px !important;
      padding: 1px 4px !important;
      font-size: 0.72rem !important;
      font-weight: 600 !important;
      line-height: 1.25 !important;
      cursor: pointer;
      display: block !important;
    }
    .fc-daygrid-event .fc-event-main { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* リスト表示の詳細カードスタイル */
    .fc-list-event { cursor: pointer; }
    .list-item-box { padding: 6px 2px; width: 100%; }
    .list-title { font-size: 0.95rem; font-weight: 700; margin-bottom: 2px; display: flex; align-items: center; gap: 6px; }
    .list-tag { font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; display: inline-block; font-weight: 600; }
    .list-desc { font-size: 0.82rem; color: #4b5563; background: #f9fafb; border-left: 3px solid #cbd5e1; padding: 4px 8px; margin-top: 4px; border-radius: 2px; white-space: pre-wrap; word-break: break-all; }

    /* モーダル */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; padding: 16px; }
    .modal-overlay.open { display: flex; }
    .modal { background: #fff; border-radius: 14px; padding: 18px; width: 100%; max-width: 380px; max-height: 90vh; overflow-y: auto; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
    .modal h2 { font-size: 1.05rem; margin-bottom: 12px; }
    .form-group { margin-bottom: 10px; }
    .form-group label { display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 3px; color: #444; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 0.9rem; }
    .checkbox-group { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .checkbox-group input { width: auto; }
    .checkbox-group label { margin-bottom: 0; font-size: 0.85rem; font-weight: 600; }
    .modal-buttons { display: flex; gap: 8px; margin-top: 14px; }
    .modal-buttons button { flex: 1; padding: 9px; border-radius: 6px; font-weight: 600; font-size: 0.9rem; border: none; cursor: pointer; }
    .btn-submit { background: #2563eb; color: #fff; }
    .btn-delete { background: #ef4444; color: #fff; }
    .btn-cancel { background: #e5e7eb; color: #4b5563; }
