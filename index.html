<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>R4予定表</title>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f5f7; color: #222; }
    header { background: #fff; padding: 10px 6px; border-bottom: 1px solid #e0e0e0; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 10; gap: 4px; }
    header h1 { font-size: 0.92rem; font-weight: 700; color: #333; margin: 0; white-space: nowrap; }
    .header-btns { display: flex; gap: 3px; flex-wrap: nowrap; }
    .btn-header { border: none; padding: 6px 7px; border-radius: 12px; font-weight: 600; font-size: 0.68rem; cursor: pointer; white-space: nowrap; }
    .btn-plunder { background: #dc2626; color: #fff; }
    .btn-memo { background: #16a34a; color: #fff; }
    .btn-kuji { background: #d946ef; color: #fff; }
    .btn-setting { background: #e5e7eb; color: #374151; }
    .btn-add { background: #2563eb; color: #fff; }

    #calendar-container { padding: 4px; max-width: 900px; margin: 0 auto; }
    #calendar { background: #fff; border-radius: 8px; }

    .fc .fc-toolbar { padding: 8px; margin-bottom: 2px; }
    .fc .fc-toolbar-title { font-size: 1rem !important; font-weight: bold; }
    .fc .fc-button { padding: 4px 8px !important; font-size: 0.8rem !important; }
    
    .fc-togglePast-button { background-color: #64748b !important; border: none !important; margin-left: 8px !important; font-size: 0.75rem !important; padding: 4px 8px !important; }

    .fc .fc-col-header-cell { padding: 4px 0; background: #fafafa; font-size: 0.8rem; }
    .fc-theme-standard td, .fc-theme-standard th { border-color: #e5e7eb; }
    .fc .fc-daygrid-day-number { font-size: 0.8rem; font-weight: 600; padding: 2px 4px !important; color: #444; }
    .fc .fc-daygrid-day-frame { min-height: 80px !important; cursor: pointer; }

    .fc-day-sun .fc-daygrid-day-number { color: #dc2626 !important; }
    .fc-day-sat .fc-daygrid-day-number { color: #2563eb !important; }
    .fc-day-holiday .fc-daygrid-day-number { color: #dc2626 !important; font-weight: 800 !important; }

    .fc-event { border: none !important; border-radius: 6px !important; margin: 1px 1px !important; padding: 1px 4px !important; font-size: 0.72rem !important; font-weight: 600 !important; line-height: 1.25 !important; cursor: pointer; display: block !important; }
    .fc-daygrid-event .fc-event-main { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; padding: 16px; }
    .modal-overlay.open { display: flex; }
    .modal { background: #fff; border-radius: 14px; padding: 18px; width: 100%; max-width: 380px; max-height: 90vh; overflow-y: auto; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
    .modal h2 { font-size: 1.05rem; margin-bottom: 12px; }
    .form-group { margin-bottom: 10px; }
    .form-group label { display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 3px; color: #444; }
    .form-group input[type="text"], .form-group input[type="date"], .form-group input[type="time"], .form-group input[type="number"], .form-group select, .form-group textarea { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 0.9rem; }
    
    .checkbox-group { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; background: #f3f4f6; padding: 8px 12px; border-radius: 8px; }
    .checkbox-group input { width: 20px; height: 20px; }
    .checkbox-group label { margin-bottom: 0; font-size: 0.9rem; font-weight: 600; }
    
    .modal-buttons { display: flex; gap: 6px; margin-top: 14px; flex-wrap: wrap; }
    .modal-buttons button { flex: 1; min-width: 60px; padding: 10px; border-radius: 6px; font-weight: 600; font-size: 0.9rem; border: none; cursor: pointer; }
    .btn-submit { background: #2563eb; color: #fff; }
    .btn-delete { background: #ef4444; color: #fff; }
    .btn-cancel { background: #e5e7eb; color: #4b5563; }
    
    /* ラベル設定・並び替え用のスタイル */
    .label-row { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; background: #f9fafb; padding: 4px 6px; border-radius: 8px; border: 1px solid #e5e7eb; }
    .label-row input[type="text"] { flex: 1; padding: 6px 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 0.88rem; }
    .order-btns { display: flex; flex-direction: column; gap: 2px; }
    .btn-order { background: #e5e7eb; color: #374151; border: none; border-radius: 4px; width: 26px; height: 18px; font-size: 0.65rem; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; line-height: 1; padding: 0; }
    .btn-order:active { background: #cbd5e1; }
    .btn-order:disabled { opacity: 0.3; cursor: default; }
  </style>
</head>
<body>

  <header>
    <h1>R4予定表</h1>
    <div class="header-btns">
      <button class="btn-header btn-plunder" onclick="location.href='plunder.html'">🚨 略奪</button>
      <button class="btn-header btn-memo" onclick="location.href='memo.html'">📝 要点</button>
      <button class="btn-header btn-kuji" onclick="location.href='kuji.html'">🎲 くじ</button>
      <button class="btn-header btn-setting" id="openSettingsBtn">⚙️ ラベル</button>
      <button class="btn-header btn-add" id="openModalBtn">＋ 追加</button>
    </div>
  </header>

  <div id="calendar-container">
    <div id="calendar"></div>
  </div>

  <div class="modal-overlay" id="alertOverlay">
    <div class="modal">
      <h2 style="color: #ea580c; display: flex; align-items: center; gap: 8px;">📢 本日の予定</h2>
      <div id="alertMessage" style="font-size: 0.95rem; white-space: pre-wrap; margin-bottom: 16px; line-height: 1.5; color: #333;"></div>
      <div class="modal-buttons">
        <button class="btn-submit" id="closeAlertBtn">OK</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h2 id="modalTitle">予定の追加</h2>
      
      <div class="form-group">
        <label>予定のタイトル</label>
        <input type="text" id="eventTitle" placeholder="例: 🧀チーズ、〇〇会議">
      </div>
      
      <div class="form-group">
        <label>カラー（カテゴリ）</label>
        <select id="eventColor"></select>
      </div>
      
      <div class="form-group">
        <label>開始日</label>
        <input type="date" id="eventDate">
      </div>
      
      <div class="checkbox-group" id="repeatWrap">
        <input type="checkbox" id="eventRepeat">
        <label for="eventRepeat">複数日に繰り返して追加する</label>
      </div>
      
      <div id="repeatEndGroup" style="display: none; background: #fef3c7; padding: 10px; border-radius: 6px; margin-bottom: 12px;">
        <div style="display: flex; align-items: center; gap: 6px; margin-bottom: 8px;">
          <label style="color: #b45309; font-size: 0.85rem; margin: 0; font-weight: bold;">間隔:</label>
          <input type="number" id="eventRepeatInterval" value="1" min="1" max="30" style="width: 60px; padding: 4px;">
          <span style="color: #b45309; font-size: 0.75rem;">日ごと (1=毎日, 2=1日おき)</span>
        </div>
        <div style="display: flex; align-items: center; gap: 6px;">
          <label style="color: #b45309; font-size: 0.85rem; margin: 0; font-weight: bold;">終了日:</label>
          <input type="date" id="eventRepeatEnd" style="flex: 1; padding: 4px;">
        </div>
      </div>

      <div class="checkbox-group">
        <input type="checkbox" id="eventAllDay" checked>
        <label for="eventAllDay">終日（時間指定なし）</label>
      </div>
      
      <div id="timePickerGroup" style="display: none; gap: 10px;">
        <div class="form-group" style="flex: 1; margin-bottom: 0;">
          <label>開始時間</label>
          <input type="time" id="eventStartTime" value="12:00">
        </div>
        <div class="form-group" style="flex: 1; margin-bottom: 0;">
          <label>終了時間（任意）</label>
          <input type="time" id="eventEndTime">
        </div>
      </div>
      
      <div class="form-group" style="margin-top: 12px;">
        <label>内容説明・メモ</label>
        <textarea id="eventDesc" rows="3" placeholder="詳細やメモがあれば入力"></textarea>
      </div>
      
      <div class="modal-buttons">
        <button class="btn-delete" id="deleteEventBtn" style="display: none;">削除</button>
        <button class="btn-cancel" id="closeModalBtn">閉じる</button>
        <button class="btn-submit" id="saveEventBtn">保存</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="settingsOverlay">
    <div class="modal">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
        <h2 style="margin:0;">ラベル設定・並び替え</h2>
        <span style="font-size:0.7rem; background:#dbeafe; color:#1e40af; padding:2px 8px; border-radius:10px; font-weight:bold;">🌐 全員に同期</span>
      </div>
      <p style="font-size: 0.76rem; color: #666; margin-bottom: 10px;">色・名前の変更と、右の<b>「▲」「▼」で順番の並び替え</b>ができます（全員の画面に反映されます）</p>
      <div id="labelInputsContainer" style="max-height: 52vh; overflow-y: auto; padding-right: 2px;"></div>
      <div class="modal-buttons">
        <button class="btn-cancel" id="closeSettingsBtn">キャンセル</button>
        <button class="btn-submit" id="saveSettingsBtn">保存して同期</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { getFirestore, collection, addDoc, doc, setDoc, deleteDoc, updateDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

    const DEFAULT_COLORS = [
      { id: 0, defaultName: "ジャザ", bg: "#06B6D4" },
      { id: 1, defaultName: "豆たん", bg: "#84CC16" },
      { id: 2, defaultName: "いかれた猫", bg: "#4B5563" },
      { id: 3, defaultName: "シチミ", bg: "#A855F7" },
      { id: 4, defaultName: "しず", bg: "#EF4444" },
      { id: 5, defaultName: "ひな", bg: "#3B82F6" },
      { id: 6, defaultName: "チーズ", bg: "#FFF066" },
      { id: 7, defaultName: "秘薬", bg: "#F97316" },
      { id: 8, defaultName: "車掌", bg: "#EC4899" },
      { id: 9, defaultName: "わらわら", bg: "#111827" }, 
      { id: 10, defaultName: "狩猟戦", bg: "#166534" }, 
      { id: 11, defaultName: "追加枠2", bg: "#991B1B" }, 
      { id: 12, defaultName: "追加枠3", bg: "#1E3A8A" }, 
      { id: 13, defaultName: "追加枠4", bg: "#581C87" }, 
      { id: 14, defaultName: "追加枠5", bg: "#9D174D" }, 
      { id: 15, defaultName: "追加枠6", bg: "#0F766E" }  
    ];

    function getTextColor(hex) {
      let h = String(hex || "#06B6D4").replace("#", "");
      if(h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
      const r = parseInt(h.substr(0,2),16), g = parseInt(h.substr(2,2),16), b = parseInt(h.substr(4,2),16);
      return (((r*299)+(g*587)+(b*114))/1000 >= 128) ? '#000000' : '#ffffff';
    }

    function getLocalCustomLabels() {
      try { const saved = localStorage.getItem("r4_custom_labels_v11"); if (saved) return JSON.parse(saved); } catch(e) {}
      return DEFAULT_COLORS.map(c => c.defaultName);
    }
    
    function getLocalCustomColors() {
      try { const saved = localStorage.getItem("r4_custom_colors_v1"); if (saved) return JSON.parse(saved); } catch(e) {}
      return DEFAULT_COLORS.map(c => c.bg);
    }

    let customLabels = getLocalCustomLabels();
    let customColors = getLocalCustomColors();
    let labelOrder = DEFAULT_COLORS.map(c => c.id); // 表示順を管理する配列

    const firebaseConfig = {
      apiKey: "AIzaSyDhHBvpdoIfVkRKbDAMsr811zXeI2AVrwo",
      authDomain: "r4calendar-1cb70.firebaseapp.com",
      projectId: "r4calendar-1cb70",
      storageBucket: "r4calendar-1cb70.firebasestorage.app",
      messagingSenderId: "273656700256",
      appId: "1:273656700256:web:254da78a155c5c8e3b5205"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const eventsRef = collection(db, "events");
    const labelSettingsRef = doc(db, "calendar_settings", "labels_v1");

    // プルダウンの選択肢を「並び順（labelOrder）」通りに描画する
    function renderColorOptions() {
      const select = document.getElementById("eventColor");
      const currentVal = select.value;
      select.innerHTML = "";
      labelOrder.forEach((colorIdx) => {
        const c = DEFAULT_COLORS[colorIdx] || DEFAULT_COLORS[0];
        const opt = document.createElement("option");
        opt.value = colorIdx;
        opt.textContent = customLabels[colorIdx] || c.defaultName;
        select.appendChild(opt);
      });
      if (currentVal !== "" && labelOrder.includes(parseInt(currentVal, 10))) {
        select.value = currentVal;
      }
    }
    renderColorOptions();

    let holidays = {};
    let currentEventDocId = null;
    let hasShownTodayAlert = false;
    let showPastInList = false;
    let rawEventDocs = []; // Firestoreから受け取った生データ
    let firebaseEventsList = [];
    let currentViewType = 'dayGridMonth';
    let calendar; 

    // ラベル設定や予定データが更新されたときにカレンダー表示を再構築する関数
    function rebuildCalendarEvents() {
      const evs = [];
      rawEventDocs.forEach((d) => {
        if (!d.start) return;
        const colorIdx = d.colorIdx !== undefined ? d.colorIdx : 0;
        const colBg = customColors[colorIdx] || DEFAULT_COLORS[0].bg;
        const colTxt = getTextColor(colBg);
        evs.push({
          id: d.id,
          title: d.title || "名称未設定",
          start: d.start,
          end: d.end || null,
          allDay: d.allDay !== false,
          backgroundColor: colBg,
          textColor: colTxt,
          extendedProps: { desc: d.desc || "", colorIdx: colorIdx }
        });
      });
      firebaseEventsList = evs;
      if (calendar) calendar.refetchEvents();
    }

    // --- ラベル設定のリアルタイム同期（全員共有） ---
    onSnapshot(labelSettingsRef, async (docSnap) => {
      if (docSnap.exists()) {
        const data = docSnap.data();
        if (Array.isArray(data.labels) && data.labels.length === DEFAULT_COLORS.length) {
          customLabels = data.labels;
        }
        if (Array.isArray(data.colors) && data.colors.length === DEFAULT_COLORS.length) {
          customColors = data.colors;
        }
        if (Array.isArray(data.order) && data.order.length === DEFAULT_COLORS.length) {
          labelOrder = data.order;
        } else {
          labelOrder = DEFAULT_COLORS.map(c => c.id);
        }
        renderColorOptions();
        rebuildCalendarEvents();
      } else {
        // クラウドにまだデータがない場合、現在のスマホの設定を初期データとしてクラウドに登録する
        try {
          await setDoc(labelSettingsRef, {
            labels: customLabels,
            colors: customColors,
            order: labelOrder,
            updatedAt: new Date().toISOString()
          });
        } catch(e) {}
      }
    });

    const calendarEl = document.getElementById('calendar');
    calendar = new FullCalendar.Calendar(calendarEl, {
      initialView: 'dayGridMonth',
      customButtons: {
        togglePast: {
          text: '過去を表示',
          click: function() {
            showPastInList = !showPastInList;
            const btn = document.querySelector('.fc-togglePast-button');
            if(btn) btn.textContent = showPastInList ? '過去を隠す' : '過去を表示';
            calendar.refetchEvents();
          }
        }
      },
      headerToolbar: { left: 'prev,next today togglePast', center: 'title', right: 'dayGridMonth,listMonth' },
      buttonText: { today: '今日', month: '月', list: 'リスト' },
      locale: 'ja',
      contentHeight: 'auto',
      dayMaxEventRows: 5,
      eventDisplay: 'block',
      
      datesSet: function(arg) {
        const btn = document.querySelector('.fc-togglePast-button');
        if (btn) {
          btn.style.display = (arg.view.type === 'listMonth') ? 'inline-block' : 'none';
          btn.textContent = showPastInList ? '過去を隠す' : '過去を表示';
        }
        if (currentViewType !== arg.view.type) {
          currentViewType = arg.view.type;
          calendar.refetchEvents();
        }
      },
      
      dayCellDidMount: function(arg) {
        const dateStr = arg.date.getFullYear() + '-' + String(arg.date.getMonth() + 1).padStart(2, '0') + '-' + String(arg.date.getDate()).padStart(2, '0');
        if (holidays[dateStr]) arg.el.classList.add('fc-day-holiday');
      },

      eventDidMount: function(arg) {
        try {
          if (arg.view.type === 'listMonth') {
            const titleTd = arg.el.querySelector('.fc-list-event-title');
            if (titleTd) {
              const props = arg.event.extendedProps || {};
              const colorIdx = props.colorIdx !== undefined ? props.colorIdx : 0;
              const colBg = customColors[colorIdx] || DEFAULT_COLORS[0].bg;
              const colTxt = getTextColor(colBg);
              const labelName = customLabels[colorIdx] || DEFAULT_COLORS[colorIdx].defaultName;

              let timeStr = ''; 
              if (!arg.event.allDay && arg.event.start) {
                let h = String(arg.event.start.getHours()).padStart(2, '0');
                let m = String(arg.event.start.getMinutes()).padStart(2, '0');
                timeStr = '<span style="font-size:0.85rem; color:#555;">' + h + ':' + m + '</span>';
              }

              let titleHtml = '<div style="display:flex; align-items:center; gap:6px; flex-wrap:wrap; font-weight:bold;"><span style="background:' + colBg + '; color:' + colTxt + '; padding:2px 6px; border-radius:4px; font-size:0.7rem;">' + labelName + '</span>' + timeStr + '<span>' + String(arg.event.title).replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</span></div>';
              if (props.desc) { titleHtml += '<div style="font-size:0.82rem; color:#4b5563; background:#f9fafb; border-left:3px solid #cbd5e1; padding:4px 8px; margin-top:4px; white-space:pre-wrap; word-break:break-all;">' + String(props.desc).replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</div>'; }
              titleTd.innerHTML = titleHtml;
            }
          }
        } catch(e) {}
      },
      
      events: function(info, successCallback, failureCallback) {
        const n = new Date();
        const tStr = n.getFullYear() + '-' + String(n.getMonth()+1).padStart(2,'0') + '-' + String(n.getDate()).padStart(2,'0');
        
        let filteredEvents = firebaseEventsList.filter(e => {
          if (currentViewType === 'listMonth' && !showPastInList) {
            if (e.start.substring(0, 10) < tStr) return false;
          }
          return true;
        });
        
        if (currentViewType === 'listMonth') {
          filteredEvents.sort((a, b) => {
            if (a.allDay && !b.allDay) return -1;
            if (!a.allDay && b.allDay) return 1;
            return a.start.localeCompare(b.start);
          });
        }
        successCallback(filteredEvents);
      },

      eventClick: function(info) { openEditModal(info.event); },
      
      dateClick: function(info) {
        currentEventDocId = null;
        document.getElementById("modalTitle").textContent = "予定の追加";
        document.getElementById("eventTitle").value = "";
        document.getElementById("eventDesc").value = "";
        document.getElementById("eventDate").value = info.dateStr;
        document.getElementById("eventStartTime").value = "12:00";
        document.getElementById("eventEndTime").value = "";
        if (labelOrder.length > 0) document.getElementById("eventColor").value = labelOrder[0];
        
        allDayCheck.checked = true;
        updateTimeInputVisibility();
        
        document.getElementById("repeatWrap").style.display = "flex";
        document.getElementById("eventRepeat").checked = false;
        document.getElementById("repeatEndGroup").style.display = "none";
        document.getElementById("eventRepeatEnd").value = "";
        document.getElementById("eventRepeatInterval").value = "1";
        
        deleteBtn.style.display = "none";
        saveBtn.style.display = "block";
        saveBtn.textContent = "保存"; 
        modal.classList.add("open");
      }
    });
    
    calendar.render();

    fetch("https://holidays-jp.github.io/api/v1/date.json")
      .then(res => res.json())
      .then(data => { holidays = data; calendar.render(); })
      .catch(e => console.log(e));

    onSnapshot(eventsRef, (snapshot) => {
      const docs = [];
      snapshot.forEach((docSnap) => {
        const d = docSnap.data();
        docs.push({ id: docSnap.id, ...d });
      });
      rawEventDocs = docs;
      rebuildCalendarEvents();

      if (!hasShownTodayAlert) {
        hasShownTodayAlert = true; 
        const now = new Date();
        const todayStr = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
        
        const todaysEvents = firebaseEventsList.filter(e => e.start && e.start.startsWith(todayStr));

        if (todaysEvents.length > 0) {
          todaysEvents.sort((a, b) => {
            if (a.allDay && !b.allDay) return -1;
            if (!a.allDay && b.allDay) return 1;
            return a.start.localeCompare(b.start);
          });

          let msg = "";
          todaysEvents.forEach(e => {
            const colName = customLabels[e.extendedProps.colorIdx] || "未設定";
            let timeStr = ""; 
            if (!e.allDay && e.start.includes("T")) timeStr = e.start.substring(11, 16) + " ";
            msg += `・${timeStr}[${colName}] ${e.title}\n`;
          });
          
          setTimeout(() => {
            document.getElementById('alertMessage').textContent = msg;
            document.getElementById('alertOverlay').classList.add('open');
          }, 800);
        }
      }
    });

    document.getElementById('closeAlertBtn').onclick = () => document.getElementById('alertOverlay').classList.remove('open');

    const allDayCheck = document.getElementById("eventAllDay");
    const timePickerGroup = document.getElementById("timePickerGroup");

    function updateTimeInputVisibility() { timePickerGroup.style.display = allDayCheck.checked ? "none" : "flex"; }
    allDayCheck.addEventListener("change", updateTimeInputVisibility);

    document.getElementById("eventRepeat").addEventListener("change", function() {
      document.getElementById("repeatEndGroup").style.display = this.checked ? "block" : "none";
    });

    const modal = document.getElementById("modalOverlay");
    const deleteBtn = document.getElementById("deleteEventBtn");
    const saveBtn = document.getElementById("saveEventBtn");

    document.getElementById("openModalBtn").onclick = () => {
      currentEventDocId = null;
      document.getElementById("modalTitle").textContent = "予定の追加";
      document.getElementById("eventTitle").value = "";
      document.getElementById("eventDesc").value = "";
      if (labelOrder.length > 0) document.getElementById("eventColor").value = labelOrder[0];
      
      const now = new Date();
      now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
      document.getElementById("eventDate").value = now.toISOString().slice(0, 10);
      document.getElementById("eventStartTime").value = "12:00";
      document.getElementById("eventEndTime").value = "";
      
      allDayCheck.checked = true;
      updateTimeInputVisibility();
      
      document.getElementById("repeatWrap").style.display = "flex";
      document.getElementById("eventRepeat").checked = false;
      document.getElementById("repeatEndGroup").style.display = "none";
      document.getElementById("eventRepeatEnd").value = "";
      document.getElementById("eventRepeatInterval").value = "1";
      
      deleteBtn.style.display = "none";
      saveBtn.style.display = "block";
      saveBtn.textContent = "保存"; 
      modal.classList.add("open");
    };

    function openEditModal(ev) {
      currentEventDocId = ev.id;
      document.getElementById("modalTitle").textContent = "予定の詳細・変更";
      document.getElementById("eventTitle").value = ev.title;
      document.getElementById("eventDesc").value = ev.extendedProps.desc || "";
      document.getElementById("eventColor").value = ev.extendedProps.colorIdx || 0;
      
      allDayCheck.checked = ev.allDay;
      if (ev.allDay) {
        document.getElementById("eventDate").value = ev.startStr.slice(0, 10);
        document.getElementById("eventStartTime").value = "12:00";
        document.getElementById("eventEndTime").value = "";
      } else {
        document.getElementById("eventDate").value = ev.startStr.slice(0, 10);
        document.getElementById("eventStartTime").value = ev.startStr.slice(11, 16);
        document.getElementById("eventEndTime").value = ev.endStr ? ev.endStr.slice(11, 16) : "";
      }

      updateTimeInputVisibility();
      
      document.getElementById("repeatWrap").style.display = "none";
      document.getElementById("eventRepeat").checked = false;
      document.getElementById("repeatEndGroup").style.display = "none";
      
      deleteBtn.style.display = "block";
      saveBtn.style.display = "block";
      saveBtn.textContent = "更新";
      modal.classList.add("open");
    }

    document.getElementById("closeModalBtn").onclick = () => modal.classList.remove("open");

    saveBtn.onclick = async () => {
      const title = document.getElementById("eventTitle").value.trim();
      const colorIdx = parseInt(document.getElementById("eventColor").value, 10);
      const isAllDay = allDayCheck.checked;
      const desc = document.getElementById("eventDesc").value.trim();
      const dateVal = document.getElementById("eventDate").value;
      const startT = document.getElementById("eventStartTime").value;
      const endT = document.getElementById("eventEndTime").value;

      const isRepeat = document.getElementById("eventRepeat").checked;
      const repeatEndStr = document.getElementById("eventRepeatEnd").value;
      let repeatInt = parseInt(document.getElementById("eventRepeatInterval").value, 10);
      if(isNaN(repeatInt) || repeatInt < 1) repeatInt = 1;

      if (!title || !dateVal) { alert("タイトルと日付を入力してください"); return; }
      if (!isAllDay && !startT) { alert("開始時間を入力してください"); return; }
      if (isRepeat && !repeatEndStr) { alert("繰り返しの終了日を入力してください"); return; }

      try {
        if (currentEventDocId) {
          let sVal = isAllDay ? dateVal : `${dateVal}T${startT}:00`;
          let eVal = isAllDay ? null : (endT ? `${dateVal}T${endT}:00` : null);
          await updateDoc(doc(db, "events", currentEventDocId), { title, colorIdx, allDay: isAllDay, start: sVal, end: eVal, desc });
        } else {
          if (isRepeat) {
            let currDate = new Date(dateVal + 'T00:00:00');
            let endDate = new Date(repeatEndStr + 'T00:00:00');
            if (currDate > endDate) { alert("終了日は開始日より後にしてください"); return; }

            while (currDate <= endDate) {
              let loopDateStr = currDate.getFullYear() + '-' + String(currDate.getMonth()+1).padStart(2,'0') + '-' + String(currDate.getDate()).padStart(2,'0');
              let sVal = isAllDay ? loopDateStr : `${loopDateStr}T${startT}:00`;
              let eVal = isAllDay ? null : (endT ? `${loopDateStr}T${endT}:00` : null);
              await addDoc(eventsRef, { title, colorIdx, allDay: isAllDay, start: sVal, end: eVal, desc, createdAt: new Date().toISOString() });
              currDate.setDate(currDate.getDate() + repeatInt);
            }
          } else {
            let sVal = isAllDay ? dateVal : `${dateVal}T${startT}:00`;
            let eVal = isAllDay ? null : (endT ? `${dateVal}T${endT}:00` : null);
            await addDoc(eventsRef, { title, colorIdx, allDay: isAllDay, start: sVal, end: eVal, desc, createdAt: new Date().toISOString() });
          }
        }
        modal.classList.remove("open");
      } catch(e) { alert("保存中にエラーが発生しました: " + e.message); }
    };

    deleteBtn.onclick = async () => {
      if (!currentEventDocId) return;
      if (confirm("この予定を削除しますか？")) {
        try { await deleteDoc(doc(db, "events", currentEventDocId)); modal.classList.remove("open"); } catch(e) {}
      }
    };

    // --- ラベル設定・並び替えモーダルの処理 ---
    const settingsModal = document.getElementById("settingsOverlay");
    const labelInputsContainer = document.getElementById("labelInputsContainer");
    let editingItems = []; // [{ id, name, bg }, ...]

    function renderSettingsRows() {
      labelInputsContainer.innerHTML = "";
      editingItems.forEach((item, pos) => {
        const row = document.createElement("div");
        row.className = "label-row";
        
        row.innerHTML = `
          <input type="color" class="edit-color-input" data-pos="${pos}" value="${item.bg}" style="width:34px; height:34px; border:none; padding:0; cursor:pointer; flex-shrink:0; border-radius:6px; background:none;">
          <input type="text" class="edit-name-input" data-pos="${pos}" value="${item.name.replace(/"/g, '&quot;')}" placeholder="ラベル名">
          <div class="order-btns">
            <button type="button" class="btn-order btn-up" data-pos="${pos}" ${pos === 0 ? "disabled" : ""}>▲</button>
            <button type="button" class="btn-order btn-down" data-pos="${pos}" ${pos === editingItems.length - 1 ? "disabled" : ""}>▼</button>
          </div>
        `;
        labelInputsContainer.appendChild(row);
      });

      // 入力中の文字や色をeditingItemsに即時反映させる
      labelInputsContainer.querySelectorAll(".edit-name-input").forEach(inp => {
        inp.oninput = (e) => {
          editingItems[parseInt(inp.dataset.pos, 10)].name = e.target.value;
        };
      });
      labelInputsContainer.querySelectorAll(".edit-color-input").forEach(inp => {
        inp.oninput = (e) => {
          editingItems[parseInt(inp.dataset.pos, 10)].bg = e.target.value;
        };
      });

      // ▲ボタン（1つ上へ移動）
      labelInputsContainer.querySelectorAll(".btn-up").forEach(btn => {
        btn.onclick = () => {
          const p = parseInt(btn.dataset.pos, 10);
          if (p > 0) {
            const tmp = editingItems[p - 1];
            editingItems[p - 1] = editingItems[p];
            editingItems[p] = tmp;
            renderSettingsRows();
          }
        };
      });

      // ▼ボタン（1つ下へ移動）
      labelInputsContainer.querySelectorAll(".btn-down").forEach(btn => {
        btn.onclick = () => {
          const p = parseInt(btn.dataset.pos, 10);
          if (p < editingItems.length - 1) {
            const tmp = editingItems[p + 1];
            editingItems[p + 1] = editingItems[p];
            editingItems[p] = tmp;
            renderSettingsRows();
          }
        };
      });
    }

    document.getElementById("openSettingsBtn").onclick = () => {
      // 現在の並び順通りに編集用リストを作る
      editingItems = labelOrder.map(id => {
        const def = DEFAULT_COLORS[id] || DEFAULT_COLORS[0];
        return {
          id: id,
          name: customLabels[id] || def.defaultName,
          bg: customColors[id] || def.bg
        };
      });
      renderSettingsRows();
      settingsModal.classList.add("open");
    };

    document.getElementById("closeSettingsBtn").onclick = () => settingsModal.classList.remove("open");

    document.getElementById("saveSettingsBtn").onclick = async () => {
      const saveSettingsBtn = document.getElementById("saveSettingsBtn");
      saveSettingsBtn.disabled = true;
      saveSettingsBtn.textContent = "同期中...";

      const newLabels = [...customLabels];
      const newColors = [...customColors];
      const newOrder = [];

      editingItems.forEach(item => {
        const def = DEFAULT_COLORS[item.id] || DEFAULT_COLORS[0];
        newLabels[item.id] = item.name.trim() || def.defaultName;
        newColors[item.id] = item.bg || def.bg;
        newOrder.push(item.id);
      });

      customLabels = newLabels;
      customColors = newColors;
      labelOrder = newOrder;

      try { 
        localStorage.setItem("r4_custom_labels_v11", JSON.stringify(customLabels)); 
        localStorage.setItem("r4_custom_colors_v1", JSON.stringify(customColors)); 
        await setDoc(labelSettingsRef, {
          labels: customLabels,
          colors: customColors,
          order: labelOrder,
          updatedAt: new Date().toISOString()
        });
        settingsModal.classList.remove("open");
      } catch(e) {
        alert("保存エラー: " + e.message);
      } finally {
        saveSettingsBtn.disabled = false;
        saveSettingsBtn.textContent = "保存して同期";
      }
    };
  </script>
</body>
</html>
