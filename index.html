<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>R4予定表</title>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f5f7; color: #222; }
    header { background: #fff; padding: 10px 14px; border-bottom: 1px solid #e0e0e0; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 10; }
    header h1 { font-size: 1.1rem; font-weight: 700; color: #333; display: flex; align-items: baseline; gap: 6px; }
    .version-mark { font-size: 0.7rem; color: #854d0e; font-weight: bold; background: #fef08a; padding: 3px 8px; border-radius: 12px; }
    .header-btns { display: flex; gap: 6px; }
    .btn-header { border: none; padding: 6px 12px; border-radius: 16px; font-weight: 600; font-size: 0.8rem; cursor: pointer; }
    .btn-setting { background: #e5e7eb; color: #374151; }
    .btn-add { background: #2563eb; color: #fff; }

    #calendar-container { padding: 4px; max-width: 900px; margin: 0 auto; }
    #calendar { background: #fff; border-radius: 8px; }

    /* FullCalendarカスタマイズ */
    .fc .fc-toolbar { padding: 8px; margin-bottom: 2px; }
    .fc .fc-toolbar-title { font-size: 1rem !important; font-weight: bold; }
    .fc .fc-button { padding: 4px 8px !important; font-size: 0.8rem !important; }
    .fc .fc-col-header-cell { padding: 4px 0; background: #fafafa; font-size: 0.8rem; }
    .fc-theme-standard td, .fc-theme-standard th { border-color: #e5e7eb; }
    .fc .fc-daygrid-day-number { font-size: 0.8rem; font-weight: 600; padding: 2px 4px !important; color: #444; }
    .fc .fc-daygrid-day-frame { min-height: 80px !important; }

    /* 日曜・土曜の色 */
    .fc-day-sun .fc-daygrid-day-number { color: #dc2626 !important; }
    .fc-day-sat .fc-daygrid-day-number { color: #2563eb !important; }

    /* 予定バッジ表示（月表示） */
    .fc-event {
      border: none !important;
      border-radius: 6px !important;
      margin: 1px 1px !important;
      padding: 1px 4px !important;
      font-size: 0.72rem !important;
      font-weight: 600 !important;
      line-height: 1.25 !important;
      cursor: pointer;
      display: block !important;
    }
    .fc-daygrid-event .fc-event-main { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* 祝日の特別スタイル */
    .holiday-text-event { pointer-events: none; border: none !important; box-shadow: none !important; margin: 0 !important; padding: 0 4px !important; }
    .holiday-text-event .fc-event-main { font-size: 0.65rem; font-weight: bold; color: #e11d48; white-space: normal; }
    .fc-list-event.holiday-text-event, .fc-list-event.fc-bg-event { display: none !important; } /* リスト表示では祝日ラベルを隠す */

    /* モーダル */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; padding: 16px; }
    .modal-overlay.open { display: flex; }
    .modal { background: #fff; border-radius: 14px; padding: 18px; width: 100%; max-width: 380px; max-height: 90vh; overflow-y: auto; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
    .modal h2 { font-size: 1.05rem; margin-bottom: 12px; }
    .form-group { margin-bottom: 10px; }
    .form-group label { display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 3px; color: #444; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 0.9rem; }
    .checkbox-group { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .checkbox-group input { width: auto; }
    .checkbox-group label { margin-bottom: 0; font-size: 0.85rem; font-weight: 600; }
    .modal-buttons { display: flex; gap: 8px; margin-top: 14px; }
    .modal-buttons button { flex: 1; padding: 9px; border-radius: 6px; font-weight: 600; font-size: 0.9rem; border: none; cursor: pointer; }
    .btn-submit { background: #2563eb; color: #fff; }
    .btn-delete { background: #ef4444; color: #fff; }
    .btn-cancel { background: #e5e7eb; color: #4b5563; }
    .label-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .color-box { width: 24px; height: 24px; border-radius: 6px; flex-shrink: 0; border: 1px solid rgba(0,0,0,0.1); }
  </style>
</head>
<body>

  <header>
    <h1>R4予定表 <span class="version-mark">v4 (安定版)</span></h1>
    <div class="header-btns">
      <button class="btn-header btn-setting" id="openSettingsBtn">⚙️ ラベル</button>
      <button class="btn-header btn-add" id="openModalBtn">＋ 予定追加</button>
    </div>
  </header>

  <div id="calendar-container">
    <div id="calendar"></div>
  </div>

  <!-- 予定追加・詳細モーダル -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h2 id="modalTitle">予定の追加</h2>
      <div class="form-group">
        <label>予定のタイトル</label>
        <input type="text" id="eventTitle" placeholder="例: 🧀チーズ、〇〇車掌">
      </div>
      <div class="form-group">
        <label>カラー（カテゴリ）</label>
        <select id="eventColor"></select>
      </div>
      <div class="checkbox-group">
        <input type="checkbox" id="eventAllDay" checked>
        <label for="eventAllDay">終日（時間指定なし）</label>
      </div>
      <div class="form-group" id="datePickerGroup">
        <label>日付</label>
        <input type="date" id="eventDate">
      </div>
      <div id="timePickerGroup" style="display: none; padding-top: 6px; border-top: 1px dashed #ccc; margin-top: 8px;">
        <div class="form-group">
          <label>開始日時</label>
          <input type="datetime-local" id="eventStart">
        </div>
        <div class="form-group">
          <label>終了日時（任意）</label>
          <input type="datetime-local" id="eventEnd">
        </div>
      </div>
      <div class="form-group">
        <label>内容説明・メモ</label>
        <textarea id="eventDesc" rows="4" placeholder="詳細やメモがあれば入力"></textarea>
      </div>
      <div class="modal-buttons">
        <button class="btn-delete" id="deleteEventBtn" style="display: none;">削除</button>
        <button class="btn-cancel" id="closeModalBtn">閉じる</button>
        <button class="btn-submit" id="saveEventBtn">保存</button>
      </div>
    </div>
  </div>

  <!-- ラベル設定モーダル -->
  <div class="modal-overlay" id="settingsOverlay">
    <div class="modal">
      <h2>色の名前・ラベル設定</h2>
      <p style="font-size: 0.78rem; color: #666; margin-bottom: 12px;">それぞれの色に付ける名前を設定できます</p>
      <div id="labelInputsContainer"></div>
      <div class="modal-buttons">
        <button class="btn-cancel" id="closeSettingsBtn">キャンセル</button>
        <button class="btn-submit" id="saveSettingsBtn">保存</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { getFirestore, collection, addDoc, doc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

    const DEFAULT_COLORS = [
      { id: 0, defaultName: "黄色", bg: "#FFF066", text: "#000000" },
      { id: 1, defaultName: "紫", bg: "#A855F7", text: "#ffffff" },
      { id: 2, defaultName: "濃いグレー", bg: "#4B5563", text: "#ffffff" },
      { id: 3, defaultName: "黄緑", bg: "#84CC16", text: "#000000" },
      { id: 4, defaultName: "赤", bg: "#EF4444", text: "#ffffff" },
      { id: 5, defaultName: "水色", bg: "#06B6D4", text: "#ffffff" },
      { id: 6, defaultName: "青", bg: "#3B82F6", text: "#ffffff" },
      { id: 7, defaultName: "オレンジ", bg: "#F97316", text: "#ffffff" },
      { id: 8, defaultName: "ピンク", bg: "#EC4899", text: "#ffffff" },
      { id: 9, defaultName: "オリーブ", bg: "#65A30D", text: "#ffffff" }
    ];

    function getCustomLabels() {
      try {
        const saved = localStorage.getItem("r4_custom_labels");
        if (saved) return JSON.parse(saved);
      } catch(e){}
      return DEFAULT_COLORS.map(c => c.defaultName);
    }
    let customLabels = getCustomLabels();

    const firebaseConfig = {
      apiKey: "AIzaSyDhHBvpdoIfVkRKbDAMsr811zXeI2AVrwo",
      authDomain: "r4calendar-1cb70.firebaseapp.com",
      projectId: "r4calendar-1cb70",
      storageBucket: "r4calendar-1cb70.firebasestorage.app",
      messagingSenderId: "273656700256",
      appId: "1:273656700256:web:254da78a155c5c8e3b5205"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const eventsRef = collection(db, "events");

    function renderColorOptions() {
      const select = document.getElementById("eventColor");
      select.innerHTML = "";
      DEFAULT_COLORS.forEach((c, idx) => {
        const opt = document.createElement("option");
        opt.value = idx;
        opt.textContent = customLabels[idx] || c.defaultName;
        select.appendChild(opt);
      });
    }
    renderColorOptions();

    let firebaseEvents = [];
    let holidayEvents = [];
    let currentEventDocId = null;

    const calendarEl = document.getElementById('calendar');
    const calendar = new FullCalendar.Calendar(calendarEl, {
      initialView: 'dayGridMonth',
      headerToolbar: { left: 'prev,next today', center: 'title', right: 'dayGridMonth,listMonth' },
      buttonText: { today: '今日', month: '月', list: 'リスト' },
      locale: 'ja',
      contentHeight: 'auto',
      dayMaxEventRows: 5,
      eventDisplay: 'block',
      
      // リスト表示の確実なデザイン調整（フリーズしない安全な方法）
      eventDidMount: function(arg) {
        if (arg.view.type === 'listMonth' && !arg.event.extendedProps.isHoliday) {
          const titleTd = arg.el.querySelector('.fc-list-event-title');
          if (titleTd) {
            const props = arg.event.extendedProps;
            const col = DEFAULT_COLORS[props.colorIdx] || DEFAULT_COLORS[0];
            const labelName = customLabels[props.colorIdx] || col.defaultName;

            titleTd.innerHTML = '';
            
            const wrapper = document.createElement('div');
            wrapper.style.padding = '4px 0';

            const titleRow = document.createElement('div');
            titleRow.style.display = 'flex';
            titleRow.style.alignItems = 'center';
            titleRow.style.gap = '6px';
            titleRow.style.fontWeight = '700';
            titleRow.style.fontSize = '0.95rem';

            const tag = document.createElement('span');
            tag.style.background = col.bg;
            tag.style.color = col.text;
            tag.style.padding = '2px 6px';
            tag.style.borderRadius = '4px';
            tag.style.fontSize = '0.7rem';
            tag.textContent = labelName;

            const titleText = document.createElement('span');
            titleText.textContent = arg.event.title;

            titleRow.appendChild(tag);
            titleRow.appendChild(titleText);
            wrapper.appendChild(titleRow);

            if (props.desc) {
              const descDiv = document.createElement('div');
              descDiv.style.fontSize = '0.82rem';
              descDiv.style.color = '#4b5563';
              descDiv.style.background = '#f9fafb';
              descDiv.style.borderLeft = '3px solid #cbd5e1';
              descDiv.style.padding = '4px 8px';
              descDiv.style.marginTop = '4px';
              descDiv.style.whiteSpace = 'pre-wrap';
              descDiv.style.wordBreak = 'break-all';
              descDiv.textContent = props.desc;
              wrapper.appendChild(descDiv);
            }
            titleTd.appendChild(wrapper);
          }
        }
      },
      eventClick: function(info) {
        if (info.event.extendedProps.isHoliday) return; // 祝日はタップ無効
        openEditModal(info.event);
      }
    });
    calendar.render();

    function refreshCalendar() {
      calendar.removeAllEvents();
      calendar.addEventSource([...holidayEvents, ...firebaseEvents]);
    }

    // 祝日データを「予定データ」として安全に読み込む
    fetch("https://holidays-jp.github.io/api/v1/date.json")
      .then(res => res.json())
      .then(data => {
        Object.keys(data).forEach(dateStr => {
          // カレンダーのマス目を赤くする用
          holidayEvents.push({
            title: data[dateStr],
            start: dateStr,
            allDay: true,
            display: 'background',
            backgroundColor: '#ffe4e6',
            classNames: ['holiday-bg-event'],
            extendedProps: { isHoliday: true }
          });
          // 祝日の名前を表示する用
          holidayEvents.push({
            title: data[dateStr],
            start: dateStr,
            allDay: true,
            backgroundColor: 'transparent',
            borderColor: 'transparent',
            classNames: ['holiday-text-event'],
            extendedProps: { isHoliday: true }
          });
        });
        refreshCalendar();
      }).catch(e => console.log(e));

    // Firebaseの予定データ読み込み
    onSnapshot(eventsRef, (snapshot) => {
      firebaseEvents = [];
      snapshot.forEach((docSnap) => {
        const d = docSnap.data();
        const col = DEFAULT_COLORS[d.colorIdx] || DEFAULT_COLORS[0];
        firebaseEvents.push({
          id: docSnap.id,
          title: d.title,
          start: d.start,
          end: d.end || null,
          allDay: d.allDay !== false,
          backgroundColor: col.bg,
          textColor: col.text,
          extendedProps: {
            desc: d.desc || "",
            colorIdx: d.colorIdx || 0,
            isHoliday: false
          }
        });
      });
      refreshCalendar();
    });

    // 終日チェックと時間の切り替え
    const allDayCheck = document.getElementById("eventAllDay");
    const datePickerGroup = document.getElementById("datePickerGroup");
    const timePickerGroup = document.getElementById("timePickerGroup");

    function updateTimeInputVisibility() {
      if (allDayCheck.checked) {
        datePickerGroup.style.display = "block";
        timePickerGroup.style.display = "none";
      } else {
        datePickerGroup.style.display = "none";
        timePickerGroup.style.display = "block";
      }
    }
    allDayCheck.addEventListener("change", updateTimeInputVisibility);

    // モーダル操作群
    const modal = document.getElementById("modalOverlay");
    const deleteBtn = document.getElementById("deleteEventBtn");
    const saveBtn = document.getElementById("saveEventBtn");

    document.getElementById("openModalBtn").onclick = () => {
      currentEventDocId = null;
      document.getElementById("modalTitle").textContent = "予定の追加";
      document.getElementById("eventTitle").value = "";
      document.getElementById("eventDesc").value = "";
      allDayCheck.checked = true;
      
      const now = new Date();
      now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
      document.getElementById("eventDate").value = now.toISOString().slice(0, 10);
      document.getElementById("eventStart").value = now.toISOString().slice(0, 16);
      document.getElementById("eventEnd").value = "";

      updateTimeInputVisibility();
      deleteBtn.style.display = "none";
      saveBtn.style.display = "block";
      modal.classList.add("open");
    };

    function openEditModal(eventObj) {
      currentEventDocId = eventObj.id;
      document.getElementById("modalTitle").textContent = "予定の詳細・削除";
      document.getElementById("eventTitle").value = eventObj.title;
      document.getElementById("eventDesc").value = eventObj.extendedProps.desc || "";
      document.getElementById("eventColor").value = eventObj.extendedProps.colorIdx || 0;
      
      allDayCheck.checked = eventObj.allDay;
      if (eventObj.allDay) {
        document.getElementById("eventDate").value = eventObj.startStr.slice(0, 10);
      } else {
        document.getElementById("eventStart").value = eventObj.startStr.slice(0, 16);
        document.getElementById("eventEnd").value = eventObj.endStr ? eventObj.endStr.slice(0, 16) : "";
      }

      updateTimeInputVisibility();
      deleteBtn.style.display = "block";
      saveBtn.style.display = "none";
      modal.classList.add("open");
    }

    document.getElementById("closeModalBtn").onclick = () => modal.classList.remove("open");

    saveBtn.onclick = async () => {
      const title = document.getElementById("eventTitle").value.trim();
      const colorIdx = parseInt(document.getElementById("eventColor").value, 10);
      const isAllDay = allDayCheck.checked;
      const desc = document.getElementById("eventDesc").value.trim();
      let startVal = isAllDay ? document.getElementById("eventDate").value : document.getElementById("eventStart").value;
      let endVal = isAllDay ? null : (document.getElementById("eventEnd").value || null);

      if (!title || !startVal) {
        alert("タイトルと日時を入力してください");
        return;
      }
      await addDoc(eventsRef, { title, colorIdx, allDay: isAllDay, start: startVal, end: endVal, desc, createdAt: new Date().toISOString() });
      modal.classList.remove("open");
    };

    deleteBtn.onclick = async () => {
      if (!currentEventDocId) return;
      if (confirm("この予定を削除しますか？")) {
        await deleteDoc(doc(db, "events", currentEventDocId));
        modal.classList.remove("open");
      }
    };

    const settingsModal = document.getElementById("settingsOverlay");
    const labelInputsContainer = document.getElementById("labelInputsContainer");

    document.getElementById("openSettingsBtn").onclick = () => {
      labelInputsContainer.innerHTML = "";
      DEFAULT_COLORS.forEach((c, idx) => {
        const row = document.createElement("div");
        row.className = "label-row";
        row.innerHTML = `<div class="color-box" style="background:${c.bg}"></div><input type="text" data-idx="${idx}" value="${customLabels[idx] || c.defaultName}" placeholder="ラベル名">`;
        labelInputsContainer.appendChild(row);
      });
      settingsModal.classList.add("open");
    };

    document.getElementById("closeSettingsBtn").onclick = () => settingsModal.classList.remove("open");

    document.getElementById("saveSettingsBtn").onclick = () => {
      const inputs = labelInputsContainer.querySelectorAll("input");
      inputs.forEach(input => {
        const idx = parseInt(input.dataset.idx, 10);
        customLabels[idx] = input.value.trim() || DEFAULT_COLORS[idx].defaultName;
      });
      try { localStorage.setItem("r4_custom_labels", JSON.stringify(customLabels)); } catch(e){}
      renderColorOptions();
      settingsModal.classList.remove("open");
    };
  </script>
</body>
</html>
